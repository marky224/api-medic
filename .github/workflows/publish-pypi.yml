name: Publish to PyPI

# Fires on every v* tag push (e.g. v1.0.0, v1.1.0, v2.0.0-rc1) and via
# manual dispatch — useful to publish an existing tag without re-tagging.
#
# Trusted publishing: no API token in repo secrets. PyPI verifies the
# upload via an OIDC token that GitHub mints for this workflow. The
# binding is configured once in PyPI's web UI under Account → Publishing.
# See deploy/pypi-trusted-publishing.md for the exact one-time steps.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to publish from (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  build-and-publish:
    name: Build wheel + sdist and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        # Local-web-UI build (no VITE_DEMO_MODE) — the wheel ships the
        # full-feature UI; the demo-mode build is hosted-demo-only.
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Stage frontend into wheel source tree
        run: |
          # pyproject.toml force-includes src/api_medic/web/frontend/ → wheel.
          # That dir is gitignored at runtime; populate it from the build.
          rm -f src/api_medic/web/frontend/.gitkeep
          cp -r frontend/dist/* src/api_medic/web/frontend/

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Smoke-check the built distributions
        run: |
          ls -lh dist/
          python -m pip install dist/*.whl
          python -c "import api_medic; print('imported api_medic', api_medic.__name__)"
          api-medic --help | head -10

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `with:` block — trusted publishing reads the project name
        # from the wheel metadata and verifies via OIDC.
