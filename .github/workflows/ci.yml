name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Type-check with mypy
        run: mypy src

      - name: Run tests
        run: pytest -m "not integration" --cov --cov-report=term-missing

  checks-coverage:
    name: 80% coverage gate on core/checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Coverage gate (core/checks ≥ 80%)
        run: pytest -m "not integration" --cov=src/api_medic/core/checks --cov-report=term-missing --cov-fail-under=80

  integration:
    name: Integration tests (live, flake-tolerant)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest -m integration -v

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  extension:
    name: Extension (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # Frontend deps are needed because the extension's tsc resolves
      # imports through the @frontend alias into ../frontend/src/*.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Type-check
        working-directory: extension
        run: npm run typecheck

      - name: Run tests
        working-directory: extension
        run: npm test

      - name: Build
        working-directory: extension
        run: npm run build

      - name: Verify dist artifact
        working-directory: extension
        run: npm run verify-dist

  schema-check:
    name: Verify TypeScript types are in sync with Pydantic schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Regenerate TypeScript types
        run: make types

      - name: Fail if generated types changed
        run: |
          if ! git diff --exit-code frontend/src/lib/types.ts; then
            echo "::error::Generated TypeScript types are out of sync."
            echo "::error::Run 'make types' locally and commit the result."
            exit 1
          fi
