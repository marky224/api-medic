name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Type-check with mypy
        run: mypy src

      - name: Run tests
        run: pytest -m "not integration" --cov --cov-report=term-missing

  checks-coverage:
    name: 80% coverage gate on core/checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Coverage gate (core/checks ≥ 80%)
        run: pytest -m "not integration" --cov=src/api_medic/core/checks --cov-report=term-missing --cov-fail-under=80

  integration:
    name: Integration tests (live, flake-tolerant)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest -m integration -v

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  extension:
    name: Extension (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # Frontend deps are needed because the extension's tsc resolves
      # imports through the @frontend alias into ../frontend/src/*.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Type-check
        working-directory: extension
        run: npm run typecheck

      - name: Run tests
        working-directory: extension
        run: npm test

      - name: Build
        working-directory: extension
        run: npm run build

      - name: Verify dist artifact
        working-directory: extension
        run: npm run verify-dist

      - name: Package Chrome and Firefox zips
        working-directory: extension
        run: npm run package

      - name: Confirm both submission zips exist
        working-directory: extension
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          test -f "packages/api-medic-chrome-${v}.zip"
          test -f "packages/api-medic-firefox-${v}.zip"

      - name: Package source zip (AMO submission)
        working-directory: extension
        run: npm run package-source

      - name: Reproducibility check (rebuild from source zip)
        working-directory: extension
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          src_zip="packages/api-medic-source-${v}.zip"
          test -f "$src_zip"

          # Unpack the original Firefox package before we leave the workspace.
          rm -rf /tmp/original-firefox
          unzip -q "packages/api-medic-firefox-${v}.zip" -d /tmp/original-firefox

          # Extract source to a clean temp dir, then build per BUILD.md.
          rm -rf /tmp/amo-repro
          unzip -q "$src_zip" -d /tmp/amo-repro
          test -f /tmp/amo-repro/BUILD.md
          test -f /tmp/amo-repro/LICENSE
          test -d /tmp/amo-repro/extension
          test -d /tmp/amo-repro/frontend/src

          (cd /tmp/amo-repro/frontend && npm ci --silent)
          (cd /tmp/amo-repro/extension && npm ci --silent && npm run build && npm run package)

          test -f "/tmp/amo-repro/extension/packages/api-medic-firefox-${v}.zip"
          test -f "/tmp/amo-repro/extension/packages/api-medic-chrome-${v}.zip"

          # Every file in the rebuilt Firefox package must match the
          # originally-submitted one byte-for-byte; if any differs, the source
          # zip is not a faithful reproduction of what we shipped.
          rm -rf /tmp/rebuilt-firefox
          unzip -q "/tmp/amo-repro/extension/packages/api-medic-firefox-${v}.zip" -d /tmp/rebuilt-firefox
          diff -r /tmp/original-firefox /tmp/rebuilt-firefox

  schema-check:
    name: Verify TypeScript types are in sync with Pydantic schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Regenerate TypeScript types
        run: make types

      - name: Fail if generated types changed
        run: |
          if ! git diff --exit-code frontend/src/lib/types.ts; then
            echo "::error::Generated TypeScript types are out of sync."
            echo "::error::Run 'make types' locally and commit the result."
            exit 1
          fi
