name: Deploy hosted demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # for OIDC role assumption
  contents: read

jobs:
  deploy:
    name: Deploy api-medic-demo to AWS
    runs-on: ubuntu-latest
    # Repo variable DEMO_DEPLOY_ENABLED gates this — set it to 'true' in
    # repo Settings → Variables once AWS prerequisites are in place
    # (see deploy/README.md). Manual dispatch always runs so it can be
    # tested before flipping the gate.
    if: vars.DEMO_DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    env:
      AWS_REGION: us-east-1
      STACK_NAME: api-medic-demo
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend (captured-mode)
        working-directory: frontend
        env:
          VITE_DEMO_MODE: "1"
        run: |
          npm ci
          npm run build

      - name: SAM build
        working-directory: deploy
        run: sam build

      - name: SAM deploy
        working-directory: deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              HostedZoneId=${{ secrets.ROUTE53_HOSTED_ZONE_ID }} \
              CertificateArn=${{ secrets.ACM_CERTIFICATE_ARN }}

      - name: Read stack outputs
        id: outputs
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`WebBucketName`].OutputValue' \
            --output text)
          DIST=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue' \
            --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution=$DIST" >> "$GITHUB_OUTPUT"

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/dist/ "s3://${{ steps.outputs.outputs.bucket }}/" \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution }}" \
            --paths "/*"

      - name: Print public URL
        run: |
          echo "::notice::Deployed to https://api-medic.markandrewmarquez.com"
