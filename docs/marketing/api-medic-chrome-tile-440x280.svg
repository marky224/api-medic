<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280" preserveAspectRatio="xMidYMid meet">
  <!-- Background: dark teal, full bleed, square corners -->
  <rect width="440" height="280" fill="#0F3F3D"/>

  <!-- Wordmark: api-medic -->
  <text x="32" y="148"
        font-family="'JetBrains Mono', 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="42"
        font-weight="500"
        fill="#F4F3EE"
        letter-spacing="-0.01em">api-medic</text>

  <!-- Tagline: exactly four words -->
  <text x="32" y="180"
        font-family="'JetBrains Mono', 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="13"
        font-weight="400"
        fill="#F4F3EE"
        opacity="0.58"
        letter-spacing="0.04em">HTTP request diagnostics</text>

  <!-- Status pill: 200 (top, refined sage green from severity-info family) -->
  <rect x="288" y="56" width="92" height="36" rx="18" fill="#D8E6D4"/>
  <text x="334" y="80"
        font-family="'JetBrains Mono', 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="16"
        font-weight="600"
        fill="#2D6B3A"
        text-anchor="middle"
        letter-spacing="0.02em">200</text>

  <!-- Status pill: 302 (middle, brand warning amber) -->
  <rect x="304" y="122" width="92" height="36" rx="18" fill="#FAEEDA"/>
  <text x="350" y="146"
        font-family="'JetBrains Mono', 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="16"
        font-weight="600"
        fill="#854F0B"
        text-anchor="middle"
        letter-spacing="0.02em">302</text>

  <!-- Status pill: 500 (bottom, brand critical red) -->
  <rect x="320" y="188" width="92" height="36" rx="18" fill="#FCEBEB"/>
  <text x="366" y="212"
        font-family="'JetBrains Mono', 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="16"
        font-weight="600"
        fill="#A32D2D"
        text-anchor="middle"
        letter-spacing="0.02em">500</text>
</svg>
